name: Apply keyboard text fidelity patch

on:
  push:
    branches: ["automation/keyboard-text-fidelity"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/keyboard-text-fidelity
          fetch-depth: 0

      - name: Apply deterministic text wire escaping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          command_path = Path('Shared/RemoteCommand.swift')
          command = command_path.read_text()
          quoted_pattern = re.compile(r'    private func quoted\(_ value: String\) -> String \{\n(?:        .*\n)+?    \}\n')
          quoted_replacement = '''    private func quoted(_ value: String) -> String {
              var escaped = ""
              escaped.reserveCapacity(value.utf8.count)
              for character in value {
                  switch character {
                  case "\\\\": escaped += "\\\\\\\\"
                  case "\\\"": escaped += "\\\\\\\""
                  case "\\n": escaped += "\\\\n"
                  case "\\r": escaped += "\\\\r"
                  case "\\t": escaped += "\\\\t"
                  default: escaped.append(character)
                  }
              }
              return "\\\"\\(escaped)\\\""
          }
          '''
          command, count = quoted_pattern.subn(lambda _: quoted_replacement, command, count=1)
          if count != 1:
              raise SystemExit(f'expected one quoted() replacement, got {count}')
          command_path.write_text(command)

          packet_path = Path('Shared/RemotePacket.swift')
          packet = packet_path.read_text()
          tokenize_pattern = re.compile(r'    private static func tokenize\(_ line: String\) -> \[String\] \{\n.*?^    \}\n', re.S | re.M)
          tokenize_replacement = '''    private static func tokenize(_ line: String) -> [String] {
              var parts: [String] = []
              var current = ""
              var inQuote = false
              var isEscaping = false

              for character in line {
                  if isEscaping {
                      if inQuote {
                          switch character {
                          case "n": current.append("\\n")
                          case "r": current.append("\\r")
                          case "t": current.append("\\t")
                          case "\\\"": current.append("\\\"")
                          case "\\\\": current.append("\\\\")
                          default:
                              current.append("\\\\")
                              current.append(character)
                          }
                      } else {
                          current.append("\\\\")
                          current.append(character)
                      }
                      isEscaping = false
                      continue
                  }

                  if character == "\\\\", inQuote {
                      isEscaping = true
                      continue
                  }
                  if character == "\\\"" {
                      inQuote.toggle()
                      continue
                  }
                  if character.isWhitespace, !inQuote {
                      if !current.isEmpty {
                          parts.append(current)
                          current.removeAll(keepingCapacity: true)
                      }
                  } else {
                      current.append(character)
                  }
              }
              if isEscaping { current.append("\\\\") }
              if !current.isEmpty { parts.append(current) }
              return parts
          }
          '''
          packet, count = tokenize_pattern.subn(lambda _: tokenize_replacement, packet, count=1)
          if count != 1:
              raise SystemExit(f'expected one tokenize() replacement, got {count}')

          anchor = '        expectSuccess("163158 FOCUSED_TEXT value Hello", token: "163158", .focusedText(status: .value, value: "Hello"))\n'
          tests = anchor + '''        let exactText = "let json = {\\\"message\\\": \\\"xin chào / cześć\\\"}\\n\\tprint(\\\"\\\\path\\\\to\\\\file 😀\\\")\\r\\n"
              expectSuccess(String(decoding: encodeV1(token: "163158", command: .typeText(exactText)), as: UTF8.self), token: "163158", .typeText(exactText))
              expectSuccess(String(decoding: encodeV1(token: "163158", command: .focusedText(status: .value, value: exactText)), as: UTF8.self), token: "163158", .focusedText(status: .value, value: exactText))
          '''
          if packet.count(anchor) != 1:
              raise SystemExit(f'expected one self-check anchor, got {packet.count(anchor)}')
          packet_path.write_text(packet.replace(anchor, tests, 1))
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-keyboard-text-fidelity.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Shared/RemoteCommand.swift Shared/RemotePacket.swift .github/workflows/apply-keyboard-text-fidelity.yml
          git commit -m "fix: preserve exact keyboard text over wire"
          git push origin HEAD:automation/keyboard-text-fidelity
