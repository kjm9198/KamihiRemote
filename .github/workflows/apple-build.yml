name: Apple Build

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Build iOS remote
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/kamihi-apple-build"
          xcodebuild \
            -project KamihiRemote.xcodeproj \
            -scheme KamihiRemote \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/kamihi-apple-build/ios-build.log"

      - name: Build macOS host
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/kamihi-apple-build"
          xcodebuild \
            -project KamihiRemote.xcodeproj \
            -scheme KamihiRemoteHost \
            -configuration Debug \
            -sdk macosx \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/kamihi-apple-build/macos-build.log"

      - name: Upload Apple build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-build-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/kamihi-apple-build/*.log
