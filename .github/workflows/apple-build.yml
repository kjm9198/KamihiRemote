name: Apple Build

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build iOS remote
        run: |
          xcodebuild \
            -project KamihiRemote.xcodeproj \
            -scheme KamihiRemote \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/KamihiDerivedAudit \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build macOS host
        run: |
          xcodebuild \
            -project KamihiRemote.xcodeproj \
            -scheme KamihiRemoteHost \
            -configuration Debug \
            -sdk macosx \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run iOS simulator UI smoke
        env:
          SKIP_BUILD: "true"
          DERIVED: /tmp/KamihiDerivedAudit
        run: bash scripts/sim-ui-smoke.sh

      - name: Upload simulator smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kamihi-ui-smoke
          path: /tmp/kamihi-ui-shots
          if-no-files-found: warn
