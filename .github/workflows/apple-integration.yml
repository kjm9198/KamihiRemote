name: Apple Integration Smoke

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Every commit keeps its own first-attempt evidence. A newer push must never
# cancel an in-flight simulator smoke for an older SHA.
concurrency:
  group: apple-integration-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  desktop-simulator-smoke:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Verify trackpad-first controller contract
        run: bash scripts/desktop-controller-contract-smoke.sh

      - name: Verify Documents persistence contract
        run: bash scripts/documents-store-contract-smoke.sh

      - name: Verify local Notes workspace contract
        run: bash scripts/notes-local-workspace-contract-smoke.sh

      - name: Verify Photos permission recovery contract
        run: bash scripts/photos-permission-recovery-contract-smoke.sh

      - name: Verify Files and PDF contract
        run: bash scripts/files-pdf-contract-smoke.sh

      - name: Verify Calculator reliability contract
        run: bash scripts/calculator-contract-smoke.sh

      - name: Verify Clipboard reliability contract
        run: bash scripts/clipboard-contract-smoke.sh

      - name: Verify standalone web-app auth/input contract
        run: bash scripts/standalone-webapps-contract-smoke.sh

      # The script may recover transient simulator infrastructure internally,
      # but product/build/protocol failures remain hard failures. Do not rerun a
      # failed same-SHA workflow to manufacture a passing first-attempt result.
      - name: Run Kamihi Desktop simulator smoke
        run: bash scripts/apple-integration-smoke.sh

      # ChatGPT is a first-class desktop app, so model-only lifecycle checks are
      # insufficient. Reuse the exact simulator binary and prove open, minimize,
      # restore/bring-front, maximize/restore, true close and reopen on both
      # current iPhone and iPad simulators before advancing to live-auth testing.
      - name: Run ChatGPT lifecycle simulator smoke
        run: bash scripts/chatgpt-lifecycle-simulator-smoke.sh

      # Clipboard paste/focus ownership is now a dedicated first-attempt app-flow
      # gate. It reuses the exact iPhone simulator build and must prove Notes
      # handoff, unsupported-target blocking, lifecycle controls, and nonblank UI.
      - name: Run Clipboard lifecycle simulator smoke
        run: bash scripts/clipboard-simulator-smoke.sh

      # Kamihi targets both device families. Reuse the exact simulator build from
      # the iPhone smoke and prove that the same binary launches and renders a
      # non-blank regular-width Desktop Lab on a current iPad simulator. This is
      # software evidence only; Magic Keyboard, pointer feel and external-display
      # behavior remain physical checks.
      - name: Run Kamihi Desktop iPad smoke
        run: bash scripts/ipad-layout-smoke.sh

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kamihi-desktop-smoke-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/kamihi-smoke/*.png
            ${{ runner.temp }}/kamihi-smoke/*.log
            ${{ runner.temp }}/kamihi-smoke/*.txt
            ${{ runner.temp }}/kamihi-smoke/*.json
