name: Apple Integration Smoke

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest validation for a branch/PR. Superseded commits are
# cancelled instead of continuing to produce stale failure notifications.
concurrency:
  group: apple-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-simulator-smoke:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Verify trackpad-first controller contract
        run: bash scripts/desktop-controller-contract-smoke.sh

      # The script performs bounded simulator recovery/retry internally. Real
      # compile/product regressions still fail the job; transient simulator boot,
      # install, launch, or screenshot issues get recovered before GitHub marks
      # the workflow as failed and sends a notification.
      - name: Run Kamihi Desktop simulator smoke
        run: bash scripts/apple-integration-smoke.sh

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kamihi-desktop-smoke-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/kamihi-smoke/*.png
            ${{ runner.temp }}/kamihi-smoke/*.log
            ${{ runner.temp }}/kamihi-smoke/*.txt
            ${{ runner.temp }}/kamihi-smoke/*.json
