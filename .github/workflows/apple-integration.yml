name: Apple Integration Smoke

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Every commit gets a complete first-attempt desktop smoke result. Newer pushes
# never cancel an older SHA's validation.
concurrency:
  group: apple-integration-${{ github.sha }}
  cancel-in-progress: false

jobs:
  desktop-simulator-smoke:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Verify trackpad-first controller contract
        run: bash scripts/desktop-controller-contract-smoke.sh

      - name: Run Kamihi Desktop simulator smoke
        run: bash scripts/apple-integration-smoke.sh

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kamihi-desktop-smoke-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/kamihi-smoke/*.png
            ${{ runner.temp }}/kamihi-smoke/*.log
            ${{ runner.temp }}/kamihi-smoke/*.txt
            ${{ runner.temp }}/kamihi-smoke/*.json
