name: Apple Integration Smoke

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Every commit keeps its own first-attempt evidence. A newer push must never
# cancel an in-flight simulator smoke for an older SHA.
concurrency:
  group: apple-integration-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  desktop-simulator-smoke:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Verify trackpad-first controller contract
        run: bash scripts/desktop-controller-contract-smoke.sh

      # The script may recover transient simulator infrastructure internally,
      # but product/build/protocol failures remain hard failures. Do not rerun a
      # failed same-SHA workflow to manufacture a passing first-attempt result.
      - name: Run Kamihi Desktop simulator smoke
        run: bash scripts/apple-integration-smoke.sh

      # Kamihi targets both device families. Reuse the exact simulator build from
      # the iPhone smoke and prove that the same binary launches and renders a
      # non-blank regular-width Desktop Lab on a current iPad simulator. This is
      # software evidence only; Magic Keyboard, pointer feel and external-display
      # behavior remain physical checks.
      - name: Run Kamihi Desktop iPad smoke
        run: bash scripts/ipad-layout-smoke.sh

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kamihi-desktop-smoke-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/kamihi-smoke/*.png
            ${{ runner.temp }}/kamihi-smoke/*.log
            ${{ runner.temp }}/kamihi-smoke/*.txt
            ${{ runner.temp }}/kamihi-smoke/*.json
