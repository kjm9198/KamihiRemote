name: Apple Integration Smoke

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Every commit gets a complete smoke result. A newer push must never cancel an
# older in-progress integration run and turn healthy code into a misleading
# cancelled/failed notification.
concurrency:
  group: apple-integration-${{ github.sha }}
  cancel-in-progress: false

jobs:
  simulator-host-smoke:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Verify trackpad-first controller contract
        run: bash scripts/desktop-controller-contract-smoke.sh

      - name: Run iPhone + Mac integration smoke
        run: bash scripts/apple-integration-smoke.sh

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # run_attempt avoids artifact-name collisions when GitHub reruns the
          # same workflow run after an infrastructure failure.
          name: kamihi-integration-smoke-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/kamihi-smoke/*.png
            ${{ runner.temp }}/kamihi-smoke/*.log
            ${{ runner.temp }}/kamihi-smoke/*.txt
            ${{ runner.temp }}/kamihi-smoke/*.json
