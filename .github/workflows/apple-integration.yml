name: Apple Integration Smoke

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: apple-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-host-smoke:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Run iPhone + Mac integration smoke
        run: bash scripts/apple-integration-smoke.sh

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kamihi-integration-smoke
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/kamihi-smoke/*.png
            ${{ runner.temp }}/kamihi-smoke/*.log
