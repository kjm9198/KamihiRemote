name: Finalize keyboard text fidelity patch

on:
  push:
    branches: ["automation/keyboard-text-fidelity"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/keyboard-text-fidelity
          fetch-depth: 0
      - name: Preserve boundary whitespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          packet_path = Path('Shared/RemotePacket.swift')
          packet = packet_path.read_text()
          pattern = re.compile(r'    private static func unquote\(_ value: String\) -> String \{\n.*?^    \}\n', re.S | re.M)
          replacement = '''    private static func unquote(_ value: String) -> String {
              // tokenize(_:) already removes wire quotes and decodes escapes.
              // Boundary whitespace is meaningful for keyboard and mirrored text.
              value
          }
          '''
          packet, count = pattern.subn(lambda _: replacement, packet, count=1)
          if count != 1:
              raise SystemExit(f'expected one unquote() replacement, got {count}')
          packet_path.write_text(packet)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/finalize-keyboard-text-fidelity.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Shared/RemotePacket.swift .github/workflows/finalize-keyboard-text-fidelity.yml
          git commit -m "fix: preserve keyboard boundary whitespace"
          git push origin HEAD:automation/keyboard-text-fidelity
